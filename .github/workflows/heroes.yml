name: heroes-daily
on:
  schedule:
    - cron: "37 3 * * *"   # каждый день 06:37 по Москве
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python hs.py
      - run: |
          git config user.name "heroes-bot"
          git config user.email "heroes-bot@users.noreply.github.com"
          git add heroes.json
          git diff --cached --quiet || git commit -m "heroes: $(date -u +%F)"
          git push
