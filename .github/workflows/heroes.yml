name: heroes-daily
on:
  schedule:
    - cron: "37 */3 * * *"   # каждые 3 часа: почасовые данные STRATZ для «24 часа» и «с начала патча»
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - hs.py
      - .github/workflows/heroes.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python hs.py
        env:
          STRATZ_TOKEN: ${{ secrets.STRATZ_TOKEN }}
      - run: |
          git config user.name "heroes-bot"
          git config user.email "heroes-bot@users.noreply.github.com"
          git add heroes.json hours.json
          git diff --cached --quiet || git commit -m "heroes: $(date -u +%F)"
          git push
