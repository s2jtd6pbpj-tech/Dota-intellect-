name: tmp-fetch-match
on: push
permissions: {contents: write}
jobs:
  f:
    if: "!contains(github.event.head_commit.message, 'data')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p r; i=0
          while read u; do i=$((i+1)); n="r/$i_$(basename "$u")"; curl -sfL -A "Mozilla/5.0 DotaIntellect/1.0" "$u" -o "r/${i}_$(basename "$u")" && echo "ok $i $u" || echo "fail $u"; done < urls.txt
          ls -la r
          git config user.name bot; git config user.email bot@x
          git add r; git commit -m data; git push
