name: tmp-fetch-match
on: push
permissions: {contents: write}
jobs:
  f:
    if: "!contains(github.event.head_commit.message, 'data')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for id in 8955247801 8955197224; do curl -sf "https://api.opendota.com/api/matches/$id" -o m_$id.json || echo fail $id; done
          git config user.name bot; git config user.email bot@x
          git add m_*.json; git commit -m data; git push
