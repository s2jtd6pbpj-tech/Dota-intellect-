name: tmp-fetch-match
on: push
permissions: {contents: write}
jobs:
  f:
    if: "!contains(github.event.head_commit.message, 'data')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p h
          for n in tusk ember_spirit abyssal_underlord nevermore dark_willow pangolier hoodwink ringmaster kez windrunner lina rattletrap furion life_stealer doom_bringer invoker lone_druid undying; do curl -sf "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/$n.png" -o h/$n.png || echo fail $n; done
          ls h | wc -l
          git config user.name bot; git config user.email bot@x
          git add h; git commit -m data; git push
